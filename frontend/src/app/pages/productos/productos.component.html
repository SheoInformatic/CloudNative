<h1>Productos (solo Admin)</h1>

<form (ngSubmit)="crear()" class="form-inline">
  <label>SKU <input [(ngModel)]="nuevoSku" name="sku" required /></label>
  <label>Nombre <input [(ngModel)]="nuevoNombre" name="nombre" required /></label>
  <label>Precio <input type="number" [(ngModel)]="nuevoPrecio" name="precio" min="0" required /></label>
  <label>Stock <input type="number" [(ngModel)]="nuevoStock" name="stock" min="0" required /></label>
  <button class="primary" type="submit">Crear producto</button>
</form>

<p *ngIf="cargando">Cargando...</p>
<p *ngIf="error" style="color:#c0392b">{{ error }}</p>

<table *ngIf="productos.length">
  <thead>
    <tr><th>SKU</th><th>Nombre</th><th>Precio</th><th>Stock</th><th></th></tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of productos">
      <td>{{ p.sku }}</td>
      <td>{{ p.nombre }}</td>
      <td>{{ p.precio }}</td>
      <td>{{ p.stock }}</td>
      <td><button class="danger" (click)="eliminar(p.id)">Eliminar</button></td>
    </tr>
  </tbody>
</table>
